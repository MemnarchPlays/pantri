{% extends 'base.html' %}
{% block content %}
<h1>{{ title }}</h1>
<div class="card mt-3" style="max-width:500px">
  <div class="card-header">{{ title }}</div>
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-bold">Item</label>
        <input name="Item" class="form-control" value="{{ values.get('Item', '') }}" maxlength="{{ input_max_length }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Quantity</label>
        <input name="Quantity" class="form-control" value="{{ values.get('Quantity', '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Unit</label>
        <select name="Unit" class="form-select">
          <option value="">— none —</option>
          {% for u in units %}
          <option {% if values.get('Unit', '') == u %}selected{% endif %}>{{ u }}</option>
          {% endfor %}
          {% if values.get('Unit') and values.get('Unit') not in units %}
          <option selected>{{ values.get('Unit') }}</option>
          {% endif %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Location</label>
        <select name="Location" class="form-select">
          {% for l in locations %}
          <option value="{{ l }}" {% if values.get('Location') == l %}selected{% endif %}>{{ l }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{{ url_for('inventory.index') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
